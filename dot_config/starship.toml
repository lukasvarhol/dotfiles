"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌](fg:bright-black) $directory$git_branch$git_status$nix_shell$python$rust$golang$java$nodejs
[└](fg:bright-black) $character"""

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"

[directory]
style = "fg:blue bold"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "fg:green bold"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:purple"
format = '([$all_status$ahead_behind]($style) )'

[nix_shell]
symbol = " "
style = "fg:blue"
format = "[$symbol$state]($style) "

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "fg:red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "fg:cyan"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "fg:red"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol$version]($style) "